# Overfit sanity check: ConvS2S on 50 sentence pairs, train == dev.
# A correct seq2seq model must be able to memorise 50 pairs. If this does not
# converge, something is wrong with the architecture, not with the data or the
# hyperparameters. Driven by scripts/overfit_test.py, which also generates
# test/data/toy/overfit50.{de,en}.
name: "conv_overfit50"
joeynmt_version: "2.3.0"
model_dir: "overfit_conv"
use_cuda: False                     # correctness check, runs on CPU
fp16: False                         # fp32: we are checking convergence, not speed
random_seed: 42

data:
    train: "test/data/toy/overfit50"  # generated by scripts/overfit_test.py
    dev: "test/data/toy/overfit50"    # deliberately the same 50 pairs
    test: "test/data/toy/overfit50"   # deliberately the same 50 pairs
    dataset_type: "plain"
    src:
        lang: "de"
        max_length: 512             # bpe200 is aggressive: 44 words -> 125 subwords.
                                    # Anything lower silently drops pairs from training.
        min_length: 1
        lowercase: False
        normalize: False
        level: "bpe"
        voc_limit: 5000             # no `voc_file`: build the vocabulary from these
        voc_min_freq: 1             # 50 pairs, so every subword is representable.
                                    # test/data/toy/bpe200.txt lacks ~2.5% of the
                                    # target subwords and caps greedy BLEU at ~71.
        tokenizer_type: "subword-nmt"
        tokenizer_cfg:
            num_merges: 200
            codes: "test/data/toy/bpe200.codes"
            dropout: 0.0
            pretokenizer: "none"
    trg:
        lang: "en"
        max_length: 512             # bpe200 is aggressive: 44 words -> 125 subwords.
                                    # Anything lower silently drops pairs from training.
        min_length: 1
        lowercase: False
        normalize: False
        level: "bpe"
        voc_limit: 5000             # no `voc_file`: build the vocabulary from these
        voc_min_freq: 1             # 50 pairs, so every subword is representable.
                                    # test/data/toy/bpe200.txt lacks ~2.5% of the
                                    # target subwords and caps greedy BLEU at ~71.
        tokenizer_type: "subword-nmt"
        tokenizer_cfg:
            num_merges: 200
            codes: "test/data/toy/bpe200.codes"
            dropout: 0.0
            pretokenizer: "none"
    special_symbols:
        unk_token: "<unk>"
        pad_token: "<pad>"
        bos_token: "<s>"
        eos_token: "</s>"
        unk_id: 0
        pad_id: 1
        bos_id: 2
        eos_id: 3

testing:
    n_best: 1
    beam_size: 1                    # greedy, matching the validation decoder
    beam_alpha: -1
    batch_size: 50
    batch_type: "sentence"
    eval_metrics: ["bleu"]
    max_output_length: 512          # long enough to reproduce any reference
    min_output_length: 1
    return_prob: "none"
    return_attention: False
    generate_unk: True
    no_repeat_ngram_size: -1
    repetition_penalty: -1
    sacrebleu_cfg:
        whitespace: False
        tokenize: "13a"

training:
    optimizer: "adam"
    adam_betas: [0.9, 0.998]
    learning_rate: 0.001
    scheduling: "plateau"           # required by build_scheduler; there is no "constant" option
    patience: 3                     # mild anneal once BLEU stops improving
    decrease_factor: 0.5
    learning_rate_min: 1.0e-9
    clip_grad_norm: 1.0
    weight_decay: 0.
    loss: "crossentropy"
    label_smoothing: 0.0            # must be 0, or the loss cannot approach 0
    batch_size: 50                  # the whole set in one batch: 1 epoch = 1 update
    batch_type: "sentence"
    batch_multiplier: 1
    normalization: "tokens"
    epochs: 2000                    # with 1 update per epoch, `updates` is the real cap
    updates: 2000                   # hard cap on steps
    validation_freq: 200            # gives the loss/BLEU curve every 200 steps
    logging_freq: 200
    early_stopping_metric: "bleu"
    shuffle: True
    overwrite: True                 # sanity check: always rerun in place
    print_valid_sents: [0, 1, 2]
    keep_best_ckpts: 1

model:
    initializer: "xavier_uniform"   # overwritten by the ConvS2S init in build_model
    init_gain: 1.0
    bias_initializer: "zeros"
    embed_initializer: "xavier_uniform"
    embed_init_gain: 1.0
    tied_embeddings: False
    tied_softmax: False
    encoder:
        type: "conv"
        num_layers: 2
        kernel_width: 3
        embeddings:
            embedding_dim: 64
            scale: False
            freeze: False
        hidden_size: 64
        max_position: 512
        dropout: 0.0                # no regularisation: we want to memorise
        freeze: False
    decoder:
        type: "conv"
        num_layers: 2
        kernel_width: 3
        embeddings:
            embedding_dim: 64
            scale: False
            freeze: False
        hidden_size: 64
        max_position: 512
        dropout: 0.0                # no regularisation: we want to memorise
        freeze: False
